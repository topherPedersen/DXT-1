<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RD-8 Custom PyTorch Transcriber</title>
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}
body{margin:0;background:#111;color:#eee}
main{width:min(850px,calc(100% - 32px));margin:32px auto}
.panel{background:#1b1b1b;border:1px solid #444;border-radius:12px;padding:20px;margin:16px 0}
input,select,button{font:inherit}
input[type=file],select{width:100%;box-sizing:border-box;padding:10px;background:#292929;color:#eee;border:1px solid #555;border-radius:8px}
button,a{display:inline-block;padding:11px 16px;border:0;border-radius:8px;background:#eee;color:#111;font-weight:700;text-decoration:none;cursor:pointer;margin:5px}
button:disabled{opacity:.45}
pre{background:#090909;padding:12px;border-radius:8px;white-space:pre-wrap}
</style>
</head>
<body><main>
<h1>RD-8 Custom PyTorch Transcriber</h1>
<p>Demucs + your locally trained five-class PyTorch model</p>
<section class="panel">
<input id="file" type="file" accept="audio/*">
<p><button id="process">Create MIDI</button></p>
<div id="status"></div>
</section>
<section class="panel">
<button id="connect">Connect MIDI</button>
<select id="outputs"></select>
<button id="play" disabled>Play</button>
<button id="stop" disabled>Stop</button>
<a id="download" hidden>Download MIDI</a>
<pre id="details">No MIDI loaded.</pre>
</section>
<script>
const $=id=>document.getElementById(id);
let midi=null,access=null,timers=[];
$("process").onclick=async()=>{
 const file=$("file").files[0];if(!file)return;
 const form=new FormData();form.append("file",file);
 $("status").textContent="Separating and transcribing…";
 try{
  const response=await fetch("/api/process",{method:"POST",body:form});
  const result=await response.json();
  if(!response.ok)throw new Error(result.detail);
  midi=new Midi(await (await fetch(result.midi_url)).arrayBuffer());
  $("download").href=result.midi_url;$("download").hidden=false;
  $("play").disabled=false;$("stop").disabled=false;
  $("details").textContent=JSON.stringify(result.metadata,null,2);
  $("status").textContent="Finished.";
 }catch(e){$("status").textContent="Error: "+e.message}
};
$("connect").onclick=async()=>{
 access=await navigator.requestMIDIAccess();
 $("outputs").innerHTML="";
 [...access.outputs.values()].forEach(o=>$("outputs").add(new Option(o.name,o.id)));
};
function stop(){timers.forEach(clearTimeout);timers=[];const o=access?.outputs.get($("outputs").value);if(o)o.send([0xB9,123,0])}
$("stop").onclick=stop;
$("play").onclick=()=>{
 stop();const o=access?.outputs.get($("outputs").value);if(!o||!midi)return;
 const notes=midi.tracks.flatMap(t=>t.notes);
 notes.forEach(n=>{
  timers.push(setTimeout(()=>o.send([0x99,n.midi,Math.max(1,Math.round(n.velocity*127))]),n.time*1000));
  timers.push(setTimeout(()=>o.send([0x89,n.midi,0]),(n.time+n.duration)*1000));
 });
};
</script>
</main></body></html>
