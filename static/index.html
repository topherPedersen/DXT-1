<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DXT-1: MP3 to Midi Drum Track Convertor</title>
  <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #111; color: #eee; }
    main { width: min(900px, calc(100% - 32px)); margin: 32px auto; }
    .panel { background:#1b1b1b; border:1px solid #444; border-radius:12px; padding:20px; margin:16px 0; }
    h1 { margin-bottom: 4px; }
    .subtle { color:#aaa; }
    label { display:block; margin:12px 0 5px; }
    input, select, button { font:inherit; }
    input[type=file], select { width:100%; box-sizing:border-box; background:#252525; color:#eee; border:1px solid #555; border-radius:8px; padding:10px; }
    .modes { display:flex; gap:18px; }
    .modes label { display:flex; align-items:center; gap:6px; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    button, .download { display:inline-block; border:0; border-radius:8px; padding:11px 16px; background:#eee; color:#111; cursor:pointer; text-decoration:none; font-weight:650; }
    button.secondary { background:#3a3a3a; color:#eee; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    #status { white-space:pre-wrap; min-height:24px; }
    progress { width:100%; }
    .controls { display:flex; flex-wrap:wrap; gap:8px; }
    #log { max-height:180px; overflow:auto; background:#0d0d0d; padding:12px; border-radius:8px; white-space:pre-wrap; }
    @media(max-width:650px){ .grid{grid-template-columns:1fr;} }
  </style>
</head>
<body>
<main>
  <h1>DXT-1: MP3 to Midi Drum Track Convertor</h1>
  <div class="subtle">MP3 → Demucs drums → ADTOF MIDI → RD-8 Groove Mode</div>

  <section class="panel">
    <label for="audioFile">Song file</label>
    <input id="audioFile" type="file" accept=".mp3,.wav,.flac,.m4a,.aac,.ogg,audio/*">

    <label>Output mode</label>
    <div class="modes">
      <label><input type="radio" name="mode" value="groove" checked> Groove Mode</label>
      <label><input type="radio" name="mode" value="full"> Full transcription</label>
    </div>

    <div id="grooveOptions" class="grid">
      <div>
        <label for="grooveBars">Repeating pattern</label>
        <select id="grooveBars">
          <option value="1">1 bar</option>
          <option value="2" selected>2 bars</option>
          <option value="4">4 bars</option>
        </select>
      </div>
      <div>
        <label for="outputBars">Generated length</label>
        <select id="outputBars">
          <option value="8">8 bars</option>
          <option value="16">16 bars</option>
          <option value="32" selected>32 bars</option>
          <option value="64">64 bars</option>
          <option value="128">128 bars</option>
        </select>
      </div>
      <div>
        <label for="complexity">Complexity: <span id="complexityText">55%</span></label>
        <input id="complexity" type="range" min="0" max="1" step=".05" value=".55">
      </div>
      <div>
        <label for="phraseEvery">Phrase landmark</label>
        <select id="phraseEvery">
          <option value="4">Every 4 bars</option>
          <option value="8" selected>Every 8 bars</option>
          <option value="16">Every 16 bars</option>
        </select>
        <label><input id="phraseMarkers" type="checkbox" checked> Add light crash marker</label>
      </div>
    </div>

    <div class="grid">
      <div>
        <label for="device">Processing device</label>
        <select id="device">
          <option value="auto" selected>Automatic</option>
          <option value="mps">Apple Silicon GPU (MPS)</option>
          <option value="cuda">NVIDIA GPU (CUDA)</option>
          <option value="cpu">CPU</option>
        </select>
      </div>
      <div>
        <label for="model">Demucs model</label>
        <select id="model">
          <option value="htdemucs" selected>htdemucs</option>
          <option value="htdemucs_ft">htdemucs_ft (slower)</option>
        </select>
      </div>
    </div>

    <p class="controls">
      <button id="processButton">Create MIDI</button>
      <a id="downloadLink" class="download" hidden>Download MIDI</a>
    </p>
    <progress id="progress" hidden></progress>
    <div id="status"></div>
  </section>

  <!-- Kept in the DOM so MIDI playback can be restored later. -->
  <section id="midiPlayer" class="panel" hidden>
    <h2>MIDI player</h2>
    <div class="controls">
      <button id="connectButton" class="secondary">Connect MIDI</button>
      <select id="midiOutputs" style="width:auto;min-width:220px"></select>
      <button id="playButton" disabled>Play</button>
      <button id="stopButton" class="secondary" disabled>Stop</button>
    </div>
    <p class="subtle">The RD-8 normally listens for drum notes on MIDI channel 10. This player sends every loaded note on channel 10.</p>
    <div id="log">No MIDI loaded.</div>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const audioFile = $("audioFile");
  const processButton = $("processButton");
  const grooveOptions = $("grooveOptions");
  const complexity = $("complexity");
  const complexityText = $("complexityText");
  const status = $("status");
  const progress = $("progress");
  const connectButton = $("connectButton");
  const outputsSelect = $("midiOutputs");
  const playButton = $("playButton");
  const stopButton = $("stopButton");
  const downloadLink = $("downloadLink");
  const log = $("log");

  let midiAccess = null;
  let midi = null;
  let timers = [];
  let activeNotes = new Set();

  function selectedMode() {
    return document.querySelector('input[name="mode"]:checked').value;
  }

  function updateModeUI() {
    grooveOptions.style.display = selectedMode() === "groove" ? "grid" : "none";
  }

  document.querySelectorAll('input[name="mode"]').forEach(input =>
    input.addEventListener("change", updateModeUI)
  );
  complexity.addEventListener("input", () => {
    complexityText.textContent = `${Math.round(Number(complexity.value) * 100)}%`;
  });
  updateModeUI();

  async function processAudio() {
    const file = audioFile.files[0];
    if (!file) {
      status.textContent = "Choose an audio file first.";
      return;
    }

    const form = new FormData();
    form.append("file", file);
    form.append("mode", selectedMode());
    form.append("groove_bars", $("grooveBars").value);
    form.append("groove_complexity", complexity.value);
    form.append("output_bars", $("outputBars").value);
    form.append("phrase_markers", $("phraseMarkers").checked ? "true" : "false");
    form.append("phrase_every_bars", $("phraseEvery").value);
    form.append("demucs_model", $("model").value);
    form.append("device", $("device").value);

    processButton.disabled = true;
    progress.hidden = false;
    status.textContent = "Separating drums and transcribing them. Keep this browser tab open…";

    try {
      const response = await fetch("/api/process", { method: "POST", body: form });
      let result;
      try { result = await response.json(); }
      catch { throw new Error(await response.text()); }

      if (!response.ok) throw new Error(result.detail || "Processing failed.");

      const midiResponse = await fetch(result.midi_url);
      if (!midiResponse.ok) throw new Error("The generated MIDI could not be downloaded.");
      const bytes = await midiResponse.arrayBuffer();
      midi = new Midi(bytes);

      downloadLink.href = result.midi_url;
      downloadLink.download = result.download_name;
      downloadLink.hidden = false;
      playButton.disabled = false;
      stopButton.disabled = false;

      status.textContent = `Finished: ${result.mode} MIDI created.`;
      log.textContent = JSON.stringify(result.metadata, null, 2);
    } catch (error) {
      status.textContent = `Error: ${error.message}`;
      console.error(error);
    } finally {
      processButton.disabled = false;
      progress.hidden = true;
    }
  }

  processButton.addEventListener("click", processAudio);

  async function connectMidi() {
    if (!navigator.requestMIDIAccess) {
      status.textContent = "Web MIDI is not supported in this browser. Use Chrome or Edge.";
      return;
    }
    try {
      midiAccess = await navigator.requestMIDIAccess({ sysex: false });
      refreshOutputs();
      midiAccess.onstatechange = refreshOutputs;
      status.textContent = "MIDI access granted. Select the RD-8 or your USB MIDI interface.";
    } catch (error) {
      status.textContent = `MIDI connection error: ${error.message}`;
    }
  }

  function refreshOutputs() {
    outputsSelect.innerHTML = "";
    const outputs = midiAccess ? [...midiAccess.outputs.values()] : [];
    if (!outputs.length) {
      outputsSelect.add(new Option("No MIDI outputs found", ""));
      return;
    }
    outputs.forEach(output => outputsSelect.add(new Option(output.name, output.id)));
  }

  function selectedOutput() {
    return midiAccess?.outputs.get(outputsSelect.value) || null;
  }

  function stopPlayback() {
    timers.forEach(clearTimeout);
    timers = [];
    const output = selectedOutput();
    if (output) {
      activeNotes.forEach(note => output.send([0x89, note, 0]));
      output.send([0xB9, 123, 0]); // all notes off, channel 10
    }
    activeNotes.clear();
    log.textContent = midi ? "Stopped." : "No MIDI loaded.";
  }

  function playMidi() {
    stopPlayback();
    const output = selectedOutput();
    if (!output) {
      status.textContent = "Connect MIDI and select an output first.";
      return;
    }
    if (!midi) return;

    const notes = midi.tracks.flatMap(track => track.notes);
    if (!notes.length) {
      status.textContent = "The MIDI contains no notes.";
      return;
    }

    const start = performance.now() + 80;
    notes.forEach(note => {
      const midiNote = note.midi;
      const velocity = Math.max(1, Math.min(127, Math.round(note.velocity * 127)));
      const onDelay = Math.max(0, note.time * 1000);
      const offDelay = Math.max(onDelay + 20, (note.time + note.duration) * 1000);

      timers.push(setTimeout(() => {
        output.send([0x99, midiNote, velocity], start + onDelay);
        activeNotes.add(midiNote);
      }, onDelay));

      timers.push(setTimeout(() => {
        output.send([0x89, midiNote, 0], start + offDelay);
        activeNotes.delete(midiNote);
      }, offDelay));
    });

    const totalSeconds = Math.max(...notes.map(n => n.time + n.duration));
    timers.push(setTimeout(() => {
      activeNotes.clear();
      log.textContent = "Playback finished.";
    }, totalSeconds * 1000 + 150));
    log.textContent = `Playing ${notes.length} hits through ${output.name}.`;
  }

  connectButton.addEventListener("click", connectMidi);
  playButton.addEventListener("click", playMidi);
  stopButton.addEventListener("click", stopPlayback);
})();
</script>
</body>
</html>
