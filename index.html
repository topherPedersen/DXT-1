<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RD-8 AI Drummer v1</title>
  <style>
    body {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: system-ui, sans-serif;
      line-height: 1.45;
    }
    fieldset { margin: 18px 0; padding: 18px; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input, textarea, select, button {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      font: inherit;
    }
    button { cursor: pointer; font-weight: 700; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    pre {
      overflow: auto;
      padding: 14px;
      background: #eee;
      max-height: 360px;
    }
    #status { font-weight: 700; margin: 16px 0; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .actions > * { flex: 1; min-width: 180px; }
  </style>
</head>
<body>
  <h1>RD-8 AI Drummer v1</h1>
  <p>
    Upload a song, analyze its tempo and energy, generate a new drum-machine
    arrangement, then play it directly through Web MIDI or download the MIDI file.
  </p>

  <form id="generateForm">
    <fieldset>
      <legend>1. Song and style</legend>

      <label for="audio">Audio file</label>
      <input id="audio" name="audio" type="file"
             accept=".wav,.mp3,.m4a,.flac,.ogg,.aiff,.aif" required />

      <label for="style">Drum style</label>
      <textarea id="style" name="style" rows="3">Classic electro/techno inspired by an analog 808-style drum machine; punchy, syncopated, and not overcrowded.</textarea>

      <label for="creativity">Density and arrangement</label>
      <textarea id="creativity" name="creativity" rows="3">Moderate density. Establish a recognizable groove, develop it every 8 bars, follow the energy curve, and use restrained fills at section boundaries.</textarea>

      <button type="submit">Analyze and generate drums</button>
    </fieldset>
  </form>

  <fieldset>
    <legend>2. MIDI output</legend>
    <button id="connectMidi" type="button">Connect MIDI</button>
    <label for="midiOutputs">Output device</label>
    <select id="midiOutputs"></select>

    <div class="actions">
      <button id="play" type="button" disabled>Play on RD-8</button>
      <button id="stop" type="button" disabled>Stop</button>
      <a id="downloadMidi" hidden>Download MIDI</a>
      <a id="downloadJson" hidden>Download JSON</a>
    </div>
  </fieldset>

  <div id="status">Ready.</div>
  <pre id="result"></pre>

<script>
"use strict";

let midiAccess = null;
let currentArrangement = null;
let scheduledTimers = [];
let playingOutput = null;

const NOTE_MAP = {
  kick: 36,
  snare: 38,
  closed_hat: 42,
  open_hat: 46,
  low_tom: 45,
  mid_tom: 47,
  high_tom: 50,
  clap: 39,
  rim: 37,
  cowbell: 56,
  cymbal: 49
};

const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");
const outputSelect = document.getElementById("midiOutputs");
const playButton = document.getElementById("play");
const stopButton = document.getElementById("stop");

function setStatus(message) {
  statusEl.textContent = message;
}

document.getElementById("generateForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  setStatus("Analyzing audio and composing...");
  resultEl.textContent = "";
  playButton.disabled = true;

  const formData = new FormData(event.currentTarget);

  try {
    const response = await fetch("/api/generate", {
      method: "POST",
      body: formData
    });

    const payload = await response.json();
    if (!response.ok) {
      throw new Error(payload.detail || "Generation failed.");
    }

    currentArrangement = payload.arrangement;
    resultEl.textContent = JSON.stringify(payload, null, 2);

    const midiLink = document.getElementById("downloadMidi");
    midiLink.href = payload.midi_url;
    midiLink.download = "";
    midiLink.hidden = false;

    const jsonLink = document.getElementById("downloadJson");
    jsonLink.href = payload.arrangement_url;
    jsonLink.download = "";
    jsonLink.hidden = false;

    playButton.disabled = !midiAccess;
    setStatus(
      `Generated ${payload.arrangement.hits.length} hits at ` +
      `${payload.arrangement.bpm} BPM across ${payload.arrangement.bars} bars.`
    );
  } catch (error) {
    setStatus(`Error: ${error.message}`);
  }
});

document.getElementById("connectMidi").addEventListener("click", async () => {
  try {
    midiAccess = await navigator.requestMIDIAccess();
    refreshOutputs();
    midiAccess.onstatechange = refreshOutputs;
    playButton.disabled = !currentArrangement;
    setStatus("MIDI connected.");
  } catch (error) {
    setStatus(`MIDI connection failed: ${error.message}`);
  }
});

function refreshOutputs() {
  outputSelect.innerHTML = "";
  if (!midiAccess) return;

  for (const output of midiAccess.outputs.values()) {
    const option = document.createElement("option");
    option.value = output.id;
    option.textContent = `${output.name || "Unnamed MIDI output"} (${output.manufacturer || "unknown"})`;
    outputSelect.appendChild(option);
  }
}

function selectedOutput() {
  if (!midiAccess) return null;
  return midiAccess.outputs.get(outputSelect.value) || null;
}

function stopPlayback() {
  for (const timer of scheduledTimers) {
    clearTimeout(timer);
  }
  scheduledTimers = [];

  if (playingOutput) {
    playingOutput.clear?.();
    // All notes off on channel 10.
    playingOutput.send([0xB9, 123, 0]);
  }
  playingOutput = null;
  stopButton.disabled = true;
  setStatus("Stopped.");
}

function playArrangement(arrangement, output) {
  stopPlayback();

  const bpm = arrangement.bpm;
  const msPerStep = 60000 / bpm / 4;
  const startTime = performance.now() + 100;
  playingOutput = output;

  for (const hit of arrangement.hits) {
    const absoluteStep = (hit.bar - 1) * 16 + hit.step;
    let timestamp = startTime + absoluteStep * msPerStep;

    // Delay odd sixteenths for swing.
    if (hit.step % 2 === 1 && arrangement.swing_percent > 50) {
      const eighthMs = msPerStep * 2;
      timestamp += eighthMs * ((arrangement.swing_percent / 100) - 0.5);
    }
    timestamp += hit.microshift_ms || 0;

    const note = NOTE_MAP[hit.instrument];
    const noteOn = [0x99, note, hit.velocity];
    const noteOff = [0x89, note, 0];

    output.send(noteOn, timestamp);
    output.send(noteOff, timestamp + Math.max(25, msPerStep / 3));
  }

  const totalMs = arrangement.bars * 16 * msPerStep + 300;
  scheduledTimers.push(setTimeout(() => {
    playingOutput = null;
    stopButton.disabled = true;
    setStatus("Playback finished.");
  }, totalMs));

  stopButton.disabled = false;
  setStatus(`Playing on ${output.name || "selected MIDI output"}...`);
}

playButton.addEventListener("click", () => {
  if (!currentArrangement) {
    setStatus("Generate an arrangement first.");
    return;
  }
  const output = selectedOutput();
  if (!output) {
    setStatus("Connect MIDI and select the RD-8 output.");
    return;
  }
  playArrangement(currentArrangement, output);
});

stopButton.addEventListener("click", stopPlayback);
</script>
</body>
</html>
