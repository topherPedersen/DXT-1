<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RD-8 AI Drummer — OaF</title>
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}
body{margin:0;background:#101010;color:#eee}
main{width:min(920px,calc(100% - 32px));margin:30px auto}
.panel{background:#1b1b1b;border:1px solid #444;border-radius:12px;padding:20px;margin:16px 0}
label{display:block;margin:12px 0 5px}
input,select,button{font:inherit}
input[type=file],select{width:100%;box-sizing:border-box;background:#272727;color:#eee;border:1px solid #555;border-radius:8px;padding:10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,.download{border:0;border-radius:8px;padding:11px 16px;background:#eee;color:#111;text-decoration:none;font-weight:700;cursor:pointer}
.secondary{background:#3b3b3b;color:#eee}
button:disabled{opacity:.45}
.subtle{color:#aaa}
progress{width:100%}
pre{white-space:pre-wrap;background:#0b0b0b;padding:12px;border-radius:8px;max-height:240px;overflow:auto}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<h1>RD-8 AI Drummer — OaF Drums</h1>
<p class="subtle">Local Demucs separation + Magenta Onsets & Frames drum transcription</p>

<section class="panel">
<label>Song</label>
<input id="file" type="file" accept="audio/*,.mp3,.wav,.flac,.m4a,.aac,.ogg">

<label>Mode</label>
<div class="row">
<label><input type="radio" name="mode" value="groove" checked> Groove Mode</label>
<label><input type="radio" name="mode" value="full"> Full OaF transcription</label>
</div>

<div id="groove" class="grid">
<div><label>Pattern length</label><select id="bars"><option>1</option><option selected>2</option><option>4</option></select></div>
<div><label>Output length</label><select id="output"><option>8</option><option>16</option><option selected>32</option><option>64</option><option>128</option></select></div>
<div><label>Complexity: <span id="complexityText">55%</span></label><input id="complexity" type="range" min="0" max="1" step=".05" value=".55"></div>
<div><label>Phrase marker</label><select id="phraseEvery"><option>4</option><option selected>8</option><option>16</option></select><label><input id="markers" type="checkbox" checked> Add light crash</label></div>
</div>

<label>Demucs model</label>
<select id="demucs"><option value="htdemucs" selected>htdemucs</option><option value="htdemucs_ft">htdemucs_ft</option></select>

<p><button id="process">Create MIDI with OaF Drums</button></p>
<progress id="progress" hidden></progress>
<div id="status"></div>
</section>

<section class="panel">
<h2>RD-8 MIDI player</h2>
<div class="row">
<button id="connect" class="secondary">Connect MIDI</button>
<select id="outputs" style="width:auto;min-width:220px"></select>
<button id="play" disabled>Play</button>
<button id="stop" class="secondary" disabled>Stop</button>
<a id="download" class="download" hidden>Download MIDI</a>
</div>
<p class="subtle">Notes are sent on MIDI channel 10.</p>
<pre id="details">No MIDI loaded.</pre>
</section>

<script>
const $=id=>document.getElementById(id);
let midiAccess=null,midi=null,timers=[],active=new Set();
const mode=()=>document.querySelector('input[name=mode]:checked').value;
document.querySelectorAll('input[name=mode]').forEach(x=>x.onchange=()=>$("groove").style.display=mode()==="groove"?"grid":"none");
$("complexity").oninput=()=>$("complexityText").textContent=Math.round($("complexity").value*100)+"%";

$("process").onclick=async()=>{
  const file=$("file").files[0];
  if(!file){$("status").textContent="Choose a song first.";return}
  const form=new FormData();
  form.append("file",file); form.append("mode",mode());
  form.append("groove_bars",$("bars").value);
  form.append("groove_complexity",$("complexity").value);
  form.append("output_bars",$("output").value);
  form.append("phrase_markers",$("markers").checked?"true":"false");
  form.append("phrase_every_bars",$("phraseEvery").value);
  form.append("demucs_model",$("demucs").value);
  $("process").disabled=true;$("progress").hidden=false;
  $("status").textContent="Separating drums, running OaF, and creating MIDI…";
  try{
    const response=await fetch("/api/process",{method:"POST",body:form});
    const result=await response.json();
    if(!response.ok)throw new Error(result.detail||"Processing failed");
    const midiResponse=await fetch(result.midi_url);
    midi=new Midi(await midiResponse.arrayBuffer());
    $("download").href=result.midi_url;$("download").download=result.download_name;$("download").hidden=false;
    $("play").disabled=false;$("stop").disabled=false;
    $("status").textContent="Finished.";
    $("details").textContent=JSON.stringify(result.metadata,null,2);
  }catch(e){$("status").textContent="Error: "+e.message;console.error(e)}
  finally{$("process").disabled=false;$("progress").hidden=true}
};

$("connect").onclick=async()=>{
  if(!navigator.requestMIDIAccess){$("status").textContent="Use Chrome or Edge for Web MIDI.";return}
  midiAccess=await navigator.requestMIDIAccess();
  const refresh=()=>{
    $("outputs").innerHTML="";
    const outputs=[...midiAccess.outputs.values()];
    if(!outputs.length)$("outputs").add(new Option("No outputs found",""));
    outputs.forEach(o=>$("outputs").add(new Option(o.name,o.id)));
  };
  refresh();midiAccess.onstatechange=refresh;
};
const selectedOutput=()=>midiAccess?.outputs.get($("outputs").value);
function stop(){
  timers.forEach(clearTimeout);timers=[];
  const out=selectedOutput();
  if(out){active.forEach(n=>out.send([0x89,n,0]));out.send([0xB9,123,0])}
  active.clear();
}
$("stop").onclick=stop;
$("play").onclick=()=>{
  stop();const out=selectedOutput();
  if(!out){$("status").textContent="Connect and select the RD-8 MIDI output.";return}
  if(!midi)return;
  const notes=midi.tracks.flatMap(t=>t.notes);
  const start=performance.now()+80;
  notes.forEach(n=>{
    const vel=Math.max(1,Math.min(127,Math.round(n.velocity*127)));
    const on=n.time*1000,off=(n.time+n.duration)*1000;
    timers.push(setTimeout(()=>{out.send([0x99,n.midi,vel],start+on);active.add(n.midi)},on));
    timers.push(setTimeout(()=>{out.send([0x89,n.midi,0],start+off);active.delete(n.midi)},off));
  });
  $("details").textContent=`Playing ${notes.length} hits through ${out.name}.`;
};
</script>
</main></body></html>
