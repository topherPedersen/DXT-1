<!DOCTYPE html>
<html>
<head>
  <!-- How to Create Beats with AI, and then play through Behringer RD-8 Drum Machine (by ChatGPT) -->
  <!-- https://chatgpt.com/share/6a543fe6-b630-83ea-99e5-8730f8d27b2b -->

  <!-- Midi File Parsing & Playback Libraries for JavaScript -->
  <!-- https://chatgpt.com/share/6a551bd6-ae0c-83ea-99d9-cbea1391a658 -->

  <!-- JZZ-midi-SMF: read, write, play midi files (.mid) in JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/jzz"></script>
	<script src="https://cdn.jsdelivr.net/npm/jzz-midi-smf"></script>
</head>
<body>
  <button id="connect">Connect to RD-8</button>
  <br>

  <button id="play" disabled>Play MIDI File on RD-8</button>
  <br>

  <button id="stop" disabled>Stop</button>

  <p id="status">Not connected</p>

  <script>
    /**
     *  How to Run Local Web Server with Python to serve up Midi Files...
     *
     *    $ cd ~/Desktop/RD8_JS_MidiPlayer
     *    $ python3 -m http.server 8000
     * 
     *  Then after the local webserver is running, in Google Chrome,
     *  visit -> http://localhost:8000/RD8_JZZ_MidiPlayer.html
     *
     */

    const filename = 'pop1.mid';

    let midiOut;
    let player;

    const connectButton = document.getElementById("connect");
    const playButton = document.getElementById("play");
    const stopButton = document.getElementById("stop");
    const status = document.getElementById("status");

    connectButton.addEventListener("click", connectToRD8);
    playButton.addEventListener("click", playMidiFile);
    stopButton.addEventListener("click", stopMidiFile);

    async function connectToRD8() {
      try {
        status.textContent = "Looking for RD-8...";

        /*
         * Open the MIDI output through JZZ.
         * The regular expression selects an output whose name contains RD-8.
         */
        midiOut = await JZZ()
          .refresh()
          .openMidiOut(/RD-8/i);

        const outputInfo = midiOut.info();

        status.textContent =
          `Connected to ${outputInfo.name || "RD-8"}`;

        playButton.disabled = false;

        console.log("Connected MIDI output:", outputInfo);
      } catch (error) {
        console.error(error);
        status.textContent =
          "Could not connect to the RD-8. Check its USB/MIDI connection.";
      }
    }

    async function playMidiFile() {
      if (!midiOut) {
        status.textContent = "Connect to the RD-8 first.";
        return;
      }

      try {
        stopMidiFile();

        status.textContent = `Loading ${filename}...`;

        /*
         * Fetch returns the MIDI file as binary data.
         * This replaces Node.js require('fs').readFileSync().
         */
        const response = await fetch(`./${filename}`);

        if (!response.ok) {
          throw new Error(
            `Could not load MIDI file: HTTP ${response.status}`
          );
        }

        const midiData = await response.arrayBuffer();

        const smf = new JZZ.MIDI.SMF(midiData);

        player = smf.player();
        player.connect(midiOut);

        /*
         * 1.0 = normal speed
         * 0.5 = half speed
         * 2.0 = double speed
         */
        player.speed(1.0);

        // player.onEnd = function () {
        //   status.textContent = "Playback finished.";
        //   stopButton.disabled = true;
        // };

        player.onEnd = function () {
          player.play();
        };

        player.play();

        status.textContent = `Playing ${filename}`;
        stopButton.disabled = false;
      } catch (error) {
        console.error(error);
        status.textContent = `Playback error: ${error.message}`;
      }
    }

    function stopMidiFile() {
      if (player) {
        player.stop();
        player.disconnect();
        player = null;
      }

      stopButton.disabled = true;

      if (midiOut) {
        status.textContent = "Connected to RD-8";
      }
    }
  </script>
</body>
</html>
